[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "student-workspace"
version = "0.2.0"
description = "Shared setup, state, recovery and application handoffs for a private student workspace."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn>=0.54,<1",
    "typst>=0.15.2,<0.16",
    "pypdf>=6,<8",
    "pdfminer.six>=20250000",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.21", "httpx>=0.28"]

[project.scripts]
student-workspace = "student_workspace.cli:main"

[project.urls]
Homepage = "https://github.com/lai-derek/student-workspace/tree/main/packages/student-workspace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
student_workspace = ["workspace-section.md", "py.typed", "studio/templates/*.typ", "studio/migrations/*.sql", "web/static/**/*"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["student_workspace"]
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
