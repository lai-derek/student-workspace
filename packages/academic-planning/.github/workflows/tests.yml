name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - {os: windows-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.15'}
          - {os: ubuntu-latest, python-version: '3.15'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "student-workspace @ git+https://github.com/lai-derek/student-workspace@v0.1.0" ".[test]"
      - run: python -m unittest discover -s tests -v
