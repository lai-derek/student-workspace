name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.15"}
          - {os: ubuntu-latest, python-version: "3.15"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "student-workspace @ git+https://github.com/lai-derek/student-workspace@v0.1.0"
          pip install -e '.[dev]'
      - name: Ruff format
        run: ruff format --check src tests scripts/demo_workspace.py
      - name: Ruff lint
        run: ruff check src tests scripts/demo_workspace.py
      - name: Mypy
        run: mypy
        if: matrix.os == 'ubuntu-latest'
      - name: Tests (deterministic; no network)
        run: python -m pytest -q -m "not live" --cov=opportunity_discovery --cov-report=term-missing
      - name: Publication audit
        run: opdisc audit .
