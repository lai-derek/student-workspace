name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: windows-latest / py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all packages from this checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/student-workspace[dev]" \
            -e "packages/opportunity-discovery[dev]" -e "packages/academic-planning[test]"

      - name: student-workspace
        working-directory: packages/student-workspace
        run: |
          ruff format --check .
          ruff check .
          mypy
          ruff format --check --config pyproject.toml ../../scripts
          ruff check --config pyproject.toml ../../scripts
          python -m pytest

      - name: opportunity-discovery
        working-directory: packages/opportunity-discovery
        run: |
          ruff format --check src tests scripts/demo_workspace.py
          ruff check src tests scripts/demo_workspace.py
          mypy
          python -m pytest -q -m "not live" --cov=opportunity_discovery --cov-report=term-missing
          opdisc audit .

      - name: academic-planning
        working-directory: packages/academic-planning
        run: python -m unittest discover -s tests -v

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
